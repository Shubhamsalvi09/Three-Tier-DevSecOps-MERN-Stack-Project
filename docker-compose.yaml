
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    networks:
      - mern-network
    volumes:
      - mongo-data:/data/db

  backend: 
    build: ./backend
    image: backend:v1
    container_name: backend
    restart: unless-stopped
    networks:
      - mern-network
    ports:
      - "3500:3500"
    environment:
      MONGO_CONN_STR: mongodb://mongodb:27017/todos
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args: 
        REACT_APP_BACKEND_URL: http://localhost:3500
    image: frontend:v1
    container_name: frontend
    restart: unless-stopped
    networks:
      - mern-network
    ports:
      - "3000:80"
    depends_on:
      - backend

networks:
  mern-network:

volumes:
  mongo-data:
